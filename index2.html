<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星语 - 官网首页</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航栏 */
    .home-header-container {
      width: 100%;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .home-header {
      max-width: 1200px;
      margin: 0 auto;
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .home-logo img {
      height: 35px;
      display: block;
    }

    .home-nav {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .home-nav ul {
      display: flex;
      list-style: none;
      gap: 24px;
    }

    .home-nav li {
      font-size: 15px;
      color: #333639;
      cursor: pointer;
      transition: color 0.2s;
    }

    .home-nav li:hover {
      color: #512874;
    }

    .home-nav a.web {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #2a2b2e;
      color: #ffffff;
      border-radius: 20px;
      text-decoration: none;
      font-size: 13px;
      transition: opacity 0.2s;
    }

    .home-nav a.web:hover {
      opacity: 0.9;
    }

    .home-nav a.web img {
      width: 15px;
      height: 16px;
      display: block;
    }

    /* 中间主体内容区域 */
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    /* 登录卡片容器 */
    .loginBox {
      position: relative;
      width: 360px;
      background: #ffffff;
      border-radius: 12px;
      padding: 32px 28px 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    /* 标题与 Tab 栏 */
    .title {
      font-size: 24px;
      font-weight: 600;
      color: #1f2225;
      text-align: center;
      margin-bottom: 20px;
    }

    .tab {
      display: flex;
      justify-content: space-around;
      border-bottom: 1px solid #e0e0e6;
      margin-bottom: 24px;
    }

    .tab-item {
      font-size: 14px;
      color: #767c82;
      padding-bottom: 8px;
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }

    .tab-item.active {
      color: #512874;
      font-weight: 500;
    }

    .tab-item.active::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(135deg, #512874 0%, #391c52 100%);
    }

    /* 表单与输入框 */
    .content-panel {
      display: none;
    }

    .content-panel.active {
      display: block;
    }

    .inputBox {
      position: relative;
      margin-bottom: 16px;
      width: 100%;
    }

    .n-input__input-el {
      width: 100%;
      height: 36px;
      padding: 0 32px 0 12px;
      font-size: 14px;
      color: #333639;
      border: 1px solid #e0e0e6;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .n-input__input-el:focus {
      border-color: #512874;
      box-shadow: 0 0 0 2px rgba(81, 40, 116, 0.2);
    }

    /* 密码可视眼图标 */
    .n-input__eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #c2c2c2;
      display: flex;
      align-items: center;
    }

    .n-input__eye:hover {
      color: #929292;
    }

    .n-input__eye svg {
      width: 16px;
      height: 16px;
    }

    /* 提交按钮（更新为渐变紫 UI） */
    .buttonActive {
      width: 100%;
      height: 36px;
      background: linear-gradient(135deg, #512874 0%, #391c52 100%);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }

    .buttonActive:hover {
      opacity: 0.9;
    }

    /* 二维码容器 */
    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
    }

    .qr-code-wrapper {
      position: relative;
      padding: 10px;
      border: 1px solid #e0e0e6;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }

    canvas {
      display: block;
    }

    .qr-tip {
      margin-top: 12px;
      font-size: 13px;
      color: #767c82;
      text-align: center;
    }

    /* 页脚 Footer */
    .home-footer-container {
      width: 100%;
      background-color: #000000;
      border-top: 1px solid #e0e0e6;
      padding: 20px 0;
    }

    .home-footer {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #ffffff;
    }

    .home-footer-copyright {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .home-footer-agreement {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .home-footer-agreement a {
      color:#ffffff;
      text-decoration: none;
      transition: color 0.2s;
    }

    .home-footer-agreement a:hover {
      color: #512874;
    }
  </style>

  <script>
    // Tab 切换逻辑
    function switchTab(index) {
      const tabs = document.querySelectorAll('.tab-item');
      const panels = document.querySelectorAll('.content-panel');
      
      tabs.forEach((tab, i) => {
        if (i === index) {
          tab.classList.add('active');
          panels[i].classList.add('active');
        } else {
          tab.classList.remove('active');
          panels[i].classList.remove('active');
        }
      });

      if (index === 0) {
        generateQRCode();
      }
    }

    // 密码显示 / 隐藏功能
    function togglePassword(inputId, eyeEl) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        eyeEl.style.color = '#512874';
      } else {
        input.type = 'password';
        eyeEl.style.color = '#c2c2c2';
      }
    }

    // 二维码绘制算法
    function generateQRCode() {
      const canvas = document.getElementById('qrCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const gridCount = 29;
      const cellSize = canvas.width / gridCount;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#000000';

      function drawPositionPattern(x, y) {
        for (let r = 0; r < 7; r++) {
          for (let c = 0; c < 7; c++) {
            if (
              r === 0 || r === 6 || c === 0 || c === 6 ||
              (r >= 2 && r <= 4 && c >= 2 && c <= 4)
            ) {
              ctx.fillRect((x + c) * cellSize, (y + r) * cellSize, cellSize, cellSize);
            }
          }
        }
      }

      drawPositionPattern(0, 0);                        // 左上角
      drawPositionPattern(gridCount - 7, 0);             // 右上角
      drawPositionPattern(0, gridCount - 7);             // 左下角

      for (let r = 0; r < gridCount; r++) {
        for (let c = 0; c < gridCount; c++) {
          const isTopLeft = r < 8 && c < 8;
          const isTopRight = r < 8 && c >= gridCount - 8;
          const isBottomLeft = r >= gridCount - 8 && c < 8;

          if (!isTopLeft && !isTopRight && !isBottomLeft) {
            if (Math.random() > 0.5) {
              ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
            }
          }
        }
      }
    }

    window.onload = function() {
      generateQRCode();
    };
  </script>
